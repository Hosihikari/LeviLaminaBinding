name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingIr
          path: BindingIr

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingGenerator
          path: BindingGenerator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingAbi
          path: BindingAbi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.LeviLamina.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/BindingAbi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project BindingGenerator/src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl
